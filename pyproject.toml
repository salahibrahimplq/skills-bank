[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-bank"
version = "0.8.0"
description = "One bank for every AI skill, prompt, agent and rule on your machine — ingest from 50+ AI tools and GitHub, search, render, export to Claude Code, serve over MCP"
requires-python = ">=3.9"
readme = "README.md"
keywords = ["claude", "skills", "prompts", "agents", "mcp", "claude-code", "codex", "cursor"]
authors = [{name = "Salah Ibrahim"}]

[project.urls]
Homepage = "https://github.com/salahibrahimplq/skills-bank"
Repository = "https://github.com/salahibrahimplq/skills-bank"

[project.license]
text = "MIT"

[project.scripts]
bank = "skills_bank.cli:main"
skills-bank = "skills_bank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
