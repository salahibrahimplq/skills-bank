[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bank"
version = "0.7.0"
description = "One bank for every AI skill, prompt, agent and rule on your machine — ingest from 50+ AI tools and GitHub, search, render, export to Claude Code, serve over MCP"
requires-python = ">=3.9"
readme = "README.md"
keywords = ["claude", "skills", "prompts", "agents", "mcp", "claude-code", "codex", "cursor"]
authors = [{name = "Salah Ibrahim"}]

[project.urls]
Homepage = "https://github.com/salahibrahimplq/ai-bank"
Repository = "https://github.com/salahibrahimplq/ai-bank"

[project.license]
text = "MIT"

[project.scripts]
bank = "ai_bank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
